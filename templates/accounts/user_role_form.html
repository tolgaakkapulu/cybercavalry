{% extends "base.html" %}
{% block title %}Set Role{% endblock %}
{% block topbar_title %}Set User Role{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Set Role: {{ target_user.username }}</h1>
  <a href="{% url 'accounts:user_list' %}" class="btn btn-secondary">Back</a>
</div>
<div class="card" style="max-width:400px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Role</label>
        {{ form.role }}
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <a href="{% url 'accounts:user_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
