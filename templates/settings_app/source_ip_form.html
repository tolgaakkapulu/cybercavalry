{% extends "base.html" %}
{% block title %}Add Source IP{% endblock %}
{% block topbar_title %}Add Allowed Source IP{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Add Allowed Source IP</h1>
  <a href="{% url 'settings_app:source_ip_list' %}" class="btn btn-ghost">Back</a>
</div>
<div class="card" style="max-width:480px;">
  <div class="card-body">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">IP Address or CIDR <span class="required">*</span></label>
        <input type="text" name="cidr" class="form-input" placeholder="192.168.1.0/24 or 10.0.0.5">
      </div>
      <div class="form-group">
        <label class="form-label">Label (optional)</label>
        <input type="text" name="label" class="form-input" placeholder="e.g. Firewall server, Monitoring agent">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <a href="{% url 'settings_app:source_ip_list' %}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
