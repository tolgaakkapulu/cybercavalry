{% extends "base.html" %}
{% block title %}Remove IP Whitelist Entry{% endblock %}
{% block topbar_title %}Remove IP Whitelist Entry{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;margin-top:40px;">
  <div class="card-body">
    <div class="alert alert-warning">
      Remove <strong class="cidr">{{ entry.cidr }}</strong> from IP whitelist?
    </div>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <a href="{% url 'whitelist:list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Remove</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
